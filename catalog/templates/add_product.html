{% extends 'base.html' %}

{% block header %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Добавление товара</h1>
</div>
{% endblock %}

{% block content %}

<div class="row text-start">
<div class="col-lg-3 col-md-6 col-sm-12">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">Добавьте товар</h4>
                </div>
                <div class="card-body">
                    <form method="post" action="" class="form-floating" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="name">Название</label>
                            <input type="text" name="name" class="form-control" id="name" placeholder="Название товара"
                                   required>
                        </div>
                        <div class="mb-3">
                            <label for="price">Цена</label>
                            <input type="number" name="price" class="form-control" id="price"
                                   placeholder="Цена товара" required>
                        </div>
                        <div class="mb-3">
                            <label for="description">Описание</label>
                            <textarea name="description" class="form-control" id="description"
                                      placeholder="Описание товара" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="category">Категория</label>
                            <input type="text" name="category" class="form-control" id="category"
                                   placeholder="Категория товара" required>
                        </div><div class="mb-3">
                            <label for="image">Изображение</label>
                            <input type="file" name="image" class="form-control" id="image"
                                   placeholder="Изображение товара" required>
                        </div>
                        <button type="submit" class="btn btn-lg btn-block btn-outline-primary">Добавить</button>
                    </form>
                </div>
            </div>
        </div>
</div>
{% endblock %}
